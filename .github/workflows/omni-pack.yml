# Copy this checkout's payload and the fossil omni-build.yml kept into the pinned amk, smoke the result and its image, and keep both; dev.yml and release.yml call this, then omni-test.yml.
name: Omni pack
on:
  workflow_call:
    inputs:
      # The version to pack as, when the caller has chosen one; empty keeps the one in the script.
      version:
        type: string
        default: ''
      # Whether to build and smoke the container image and keep its context; release.yml asks for it, dev.yml does not.
      image:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  pack:
    name: Pack tkt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Write the version into the script
        if: inputs.version != ''
        run: make stamp VERSION="${{ inputs.version }}"
      - name: Download fossil
        uses: actions/download-artifact@v8
        with:
          name: tkt-fossil
          path: omni/build
      - name: Restore the exec bit
        run: chmod +x omni/build/fossil
      # The pin lives in omni/Makefile, so that file is the cache key; a changed pin misses and fetches the new release.
      - name: Cache the pinned amk
        uses: actions/cache@v6
        with:
          path: omni/*.ape
          key: omni-amk-${{ hashFiles('omni/Makefile') }}
      # Fetches the release when the cache missed, then checks its digest against the pin either way.
      - name: Fetch and verify the pinned amk
        run: make omni.amk
      # The binary's banner must name the version the pin does; a mismatch means the release asset is not that release.
      - name: The amk is the pinned version
        run: |
          v=$(make -s -C omni --eval='v: ; @echo $(amk.version)' v)
          sh "omni/amk-$v.ape" --version | sed -n 2p | grep -F "(amk $v"
      # The -o flag keeps make from recompiling fossil, which this job has no toolchain for.
      - name: Pack and smoke
        run: make -C omni -o build/fossil repack smoke
      - name: Upload tkt
        uses: actions/upload-artifact@v7
        with:
          name: tkt-omni
          path: omni/out/tkt
          if-no-files-found: error
          retention-days: 14
      # The image needs one tool from cosmocc, which omni-build.yml left in the cache; a miss fetches it again.
      - name: Restore the toolchain
        if: inputs.image
        uses: actions/cache/restore@v6
        with:
          path: |
            omni/*.tar.gz
            omni/*.zip
            omni/*.ape
            omni/cosmocc
          key: omni-deps-${{ runner.os }}-${{ hashFiles('omni/Makefile') }}
          restore-keys: |
            omni-deps-${{ runner.os }}-
      - name: Toolchain
        if: inputs.image
        run: make omni.toolchain
      # The image is the same artifact assimilated per arch; smoke runs inside it, so this proves the amd64 half, and release.yml publishes both.
      - name: Docker image
        if: inputs.image
        run: make -C omni -o build/fossil build.docker
      - name: Smoke the image
        if: inputs.image
        run: make -C omni -o build/fossil smoke.docker
      # A tarball, since upload-artifact drops the exec bits the context needs.
      - name: Pack the image context
        if: inputs.image
        run: tar -C omni/build/docker -cf docker-context.tar amd64 arm64
      - name: Upload the image context
        if: inputs.image
        uses: actions/upload-artifact@v7
        with:
          name: tkt-docker-context
          path: docker-context.tar
          if-no-files-found: error
          retention-days: 14
