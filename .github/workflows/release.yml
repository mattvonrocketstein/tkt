# Every push to main is a release, and a manual run on main is one too: the next version is chosen here, the omnibus is built as it through omni-build.yml and omni-pack.yml and tested through omni-test.yml, the script is tested through test.yml, then both are published with their digests as a GitHub Release and the image to ghcr.
name: Release
on:
  workflow_dispatch: {}
  push:
    branches: [ "main" ]
    paths-ignore: ['**.md', '**.png', '**.svg']
permissions:
  contents: read
# One release at a time, so each run sees the tag the run before it made.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # No one names a version: it is the highest v-tag with its last number raised by one, counted from the script's own version while there is no tag, and the tag is made only when the release is.
  version:
    name: Next version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Choose the next version
        id: next
        run: |
          last="$(gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          base="${last#v}"
          [ -n "$base" ] || base="$(bash ./tkt version | cut -d' ' -f2)"
          next="${base%.*}.$(( ${base##*.} + 1 ))"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "counting from ${last:-the script at $base}, releasing v${next}"

  build:
    uses: ./.github/workflows/omni-build.yml

  pack:
    needs: [ version, build ]
    uses: ./.github/workflows/omni-pack.yml
    with:
      version: ${{ needs.version.outputs.version }}
      image: true

  # Nothing publishes until the binary passes the same suite dev.yml runs.
  test:
    needs: [ version, pack ]
    uses: ./.github/workflows/omni-test.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # The script ships too, so it passes its own suite on the hosts test.yml covers.
  slim:
    uses: ./.github/workflows/test.yml

  # The image for amd64 and arm64 from the context omni-pack.yml smoked; a manual run on another branch builds both and pushes nothing.
  image:
    name: Publish image
    needs: [ version, test, slim ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download the image context
        uses: actions/download-artifact@v8
        with:
          name: tkt-docker-context
      - name: Unpack the image context
        run: mkdir -p context && tar -C context -xf docker-context.tar
      # The Dockerfile copies a prebuilt executable per platform and runs nothing, so a multi-platform build needs no emulation.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        env:
          PUSH: ${{ github.ref == 'refs/heads/main' && '--push' || '' }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tkt"
          docker buildx build ${PUSH} \
            --platform linux/amd64,linux/arm64 \
            --target tkt \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            -t "${image}:${VERSION}" \
            -t "${image}:latest" \
            -f omni/Dockerfile context

  # A manual run on another branch is a dry run: it builds and tests, and this job is skipped.
  publish:
    name: Publish release
    needs: [ version, test, slim ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The script is an asset, so it carries the version it ships under.
      - name: Write the version into the script
        run: make stamp VERSION="${VERSION}"
      # Outside the checkout, where the script of the same name already sits.
      - name: Download tkt
        uses: actions/download-artifact@v8
        with:
          name: tkt-omni
          path: ${{ runner.temp }}/omni
      # Both must name the version they ship under; a mismatch means the pack did not take the chosen one.
      - name: Version matches the release
        run: |
          want="tkt ${VERSION}"
          [ "$(bash ./tkt version)" = "$want" ]
          [ "$(sh "$RUNNER_TEMP/omni/tkt" version)" = "$want" ]
      - name: Stage assets
        run: |
          mkdir -p dist
          install -m 0755 "$RUNNER_TEMP/omni/tkt" dist/tkt
          install -m 0755 tkt dist/tkt-slim
          cd dist
          sha256sum tkt > tkt.sha256
          sha256sum tkt-slim > tkt-slim.sha256
          cat tkt.sha256 tkt-slim.sha256
      - name: Release notes
        run: |
          {
            echo "tkt v${VERSION}: a ticket tracker over fossil."
            echo
            echo 'The omnibus is one file with fossil, jq and bash inside, for a host that has none of them:'
            echo
            echo '```bash'
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/tkt"
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/tkt.sha256"
            echo 'sha256sum -c tkt.sha256 && chmod +x tkt'
            echo '```'
            echo
            echo 'The slim build is the script alone, for a host with fossil, jq and bash of its own:'
            echo
            echo '```bash'
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/tkt-slim"
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/tkt-slim.sha256"
            echo 'sha256sum -c tkt-slim.sha256 && install -m 0755 tkt-slim tkt'
            echo '```'
            echo
            echo 'The image is the omnibus in a container, with the project mounted as its work tree:'
            echo
            echo '```bash'
            echo "docker run --rm -v \"\$PWD:/work\" ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tkt:${VERSION} list"
            echo '```'
            echo
            echo 'The omnibus is built on amk; its inputs are pinned by version and digest in omni/Makefile at this tag.'
          } > notes.md
      # Creating the release makes the tag, on the commit this run built.
      - name: Create release
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "tkt v${VERSION}" \
            --notes-file notes.md \
            dist/tkt dist/tkt.sha256 dist/tkt-slim dist/tkt-slim.sha256
