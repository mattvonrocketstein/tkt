name: test

# a push to main is a release, and release.yml calls this itself
on:
  push:
    branches-ignore: [ "main" ]
  pull_request:
  workflow_call: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install fossil (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fossil

      - name: Install fossil (macos)
        if: runner.os == 'macOS'
        run: brew install fossil

      - run: make init
      - run: make test

      - name: Test under the macOS system bash
        if: runner.os == 'macOS'
        run: TKT_BASH=/bin/bash make test

      - name: Install and smoke
        run: |
          make install.slim
          "$HOME/.local/bin/tkt" version

      - run: make clean
