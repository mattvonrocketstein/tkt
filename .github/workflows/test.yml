name: test

# a push to main is a release, and release.yml calls this itself
on:
  push:
    branches-ignore: [ "main" ]
  pull_request:
  workflow_call: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install fossil
        run: sudo apt-get update && sudo apt-get install -y fossil

      - run: make init
      - run: make test

      - name: Install and smoke
        run: |
          make install.slim
          "$HOME/.local/bin/tkt" version

      - run: make clean
